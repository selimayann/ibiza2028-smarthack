[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "0.1.0"
description = "Secure Networks, Simply Explained — R Systems Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7",
  "flask>=3.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netscan = "netscan.cli:main"

[tool.setuptools.packages.find]
include = ["netscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
