# Mosquitto 1.6 pentru lab → MQTT_EXPOSED (acceptă clienți anonimi, intenționat).
listener 1883
allow_anonymous true
persistence false

# Fără subiectele $SYS. Altfel scriptul nmap mqtt-subscribe (rulează automat la -sV)
# citește $SYS/broker/version și înlocuiește numele serviciului „mqtt” cu
# „mosquitto version 1.6.15” în XML.
sys_interval 0
